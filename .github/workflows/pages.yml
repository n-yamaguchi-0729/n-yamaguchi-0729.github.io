name: Pages

on:
  workflow_run:
    workflows: ["Static public pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Stage only public runtime files
        shell: bash
        run: |
          mkdir _site
          cp -- \
            .nojekyll \
            googlee8a500422e0afa27.html \
            homepage-en.html \
            homepage-jp.html \
            index.html \
            robots.txt \
            sitemap.xml \
            _site/
          cp -a -- YamaLean4Lib_pages ProCGroups_pages _site/
          rm -f -- _site/ProCGroups_pages/.site-manifest.json
          test "$(find _site -type l -print -quit)" = ""
          test "$(find _site -type f -iname '*.zip' -print -quit)" = ""
          test ! -e _site/ProCGroups_pages/download
          test ! -e _site/ProCGroups_pages/tools
          test ! -e _site/ProCGroups_pages/README.md
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
