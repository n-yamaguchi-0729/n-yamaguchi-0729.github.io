name: Static public pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify the generated ProCGroups documentation
        run: >-
          python3 .github/validation/check_generated_site.py
          ProCGroups_pages
      - name: Verify the public repository
        run: python3 .github/validation/check_public_repository.py .
      - name: Check whitespace
        run: git diff-tree --check --root -r HEAD
